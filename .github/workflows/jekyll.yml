name: Build and deploy LJT-Homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Verify homepage content and page scope
        run: |
          python3 - <<'PY'
          import html
          import re
          from pathlib import Path

          site = Path('_site')
          expected_pages = {'index.html', 'publications/index.html'}
          actual_pages = {str(path.relative_to(site)) for path in site.rglob('*.html')}
          assert actual_pages == expected_pages, f'Unexpected page output: {actual_pages}'

          titles = [
              'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
              'On the Perception Bottleneck of VLMs for Chart Understanding',
              'On the Universal Truthfulness Hyperplane Inside LLMs',
              'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
              'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
              'Composing Parameter-Efficient Modules with Arithmetic Operations',
          ]
          placeholders = ['Your Name', 'Your Sidebar Name', 'Red Brick University', 'none@example.org', 'yourorcidurl', 'Academic Pages is a ready-to-fork']
          for filename in expected_pages:
              rendered = (site / filename).read_text()
              text = html.unescape(re.sub(r'<[^>]+>', ' ', rendered))
              text = ' '.join(text.split())
              for title in titles:
                  assert title in text, f'Missing publication in {filename}: {title}'
              for placeholder in placeholders:
                  assert placeholder not in rendered, f'Placeholder in {filename}: {placeholder}'
              for contact in ['jliugi@connect.ust.hk', 'Vicent0205', 'tbK9jl4AAAAJ', 'junteng88716710']:
                  assert contact in rendered, f'Missing contact in {filename}: {contact}'
              assert '{{' not in rendered and '{%' not in rendered, f'Unrendered Liquid in {filename}'

          homepage = (site / 'index.html').read_text()
          for anchor in ['about', 'education', 'research-experience', 'publications', 'skills', 'awards', 'contact']:
              assert f'id="{anchor}"' in homepage, f'Missing section anchor: {anchor}'
          assert '/LJT-Homepage/assets/' in homepage, 'Missing project-site asset base path'
          print('Verified: only About and Publications pages, all six publications on both, contact details, section anchors and project-site asset paths.')
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
