name: Jekyll build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Verify page scope and memory-backed publications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          expected = {'index.html', 'publications/index.html'}
          actual = {str(p.relative_to('_site')) for p in Path('_site').rglob('*.html')}
          assert actual == expected, f'Unexpected HTML pages: {sorted(actual - expected)}; missing: {sorted(expected - actual)}'
          titles = [
              'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
              'On the Perception Bottleneck of VLMs for Chart Understanding',
              'On the Universal Truthfulness Hyperplane Inside LLMs',
              'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
              'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
              'Composing Parameter-Efficient Modules with Arithmetic Operations',
          ]
          for page in sorted(expected):
              text = Path('_site', page).read_text()
              for title in titles:
                  assert title in text, f'{title!r} missing from {page}'
              for placeholder in ('Your Name', 'Your Sidebar Name', 'none@example.org', 'Red Brick University', 'Paper Title Number'):
                  assert placeholder not in text, f'Template placeholder in {page}: {placeholder}'
              assert 'jliugi@connect.ust.hk' in text
              assert 'https://github.com/Vicent0205' in text
              assert not re.search(r'<img[^>]+src="[^"]*/images/"', text), f'Empty avatar in {page}'
          print('Verified: only About and Publications pages; all six memory-backed publications appear on both.')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
